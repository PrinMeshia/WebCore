[theme]
name = "webcore-maintenance"

[theme.colors]
primary    = "#F59E0B"
secondary  = "#FBBF24"
background = "#0B1120"
surface    = "#151C2C"
border     = "#26304A"
text       = "#F1F5F9"
muted      = "#9AA7BD"
accent     = "#FBBF24"
danger     = "#EF4444"
code-bg    = "#0D1117"

[theme.fonts]
mono = "ui-monospace, SFMono-Regular, 'Fira Code', monospace"
sans = "Inter, system-ui, sans-serif"

[theme.spacing]
xs  = "0.25rem"
sm  = "0.5rem"
md  = "1rem"
lg  = "1.5rem"
xl  = "2.5rem"
xxl = "5rem"

[theme.radius]
sm = "6px"
md = "12px"
lg = "20px"
